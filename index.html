<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }

    /* AC9 + AC10: centred, capped, phone-friendly */
    .calc {
      background: #16213e;
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      width: 100%;
      max-width: 340px;   /* AC10: desktop cap */
      overflow: hidden;
    }

    /* Display */
    .display {
      background: #0f3460;
      padding: 1rem 1.25rem;
      text-align: right;
    }
    .display__expr {
      color: #8899aa;
      font-size: 0.85rem;
      min-height: 1.2em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* AC8: truncate long results */
    .display__main {
      color: #e0e0e0;
      font-size: 2rem;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .display__main.error {
      color: #ff6b6b;
      font-size: 1.5rem;
    }

    /* Button grid */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #0f3460;
    }

    /* AC9: at least 44 px tap targets */
    .key {
      background: #16213e;
      border: none;
      color: #e0e0e0;
      font-size: 1.25rem;
      min-height: 64px;
      cursor: pointer;
      transition: background 0.1s;
      padding: 0;
    }
    .key:hover  { background: #1a2a50; }
    .key:active { background: #0f3460; }

    .key--operator { color: #4cc9f0; }
    .key--equals   { background: #4361ee; color: #fff; }
    .key--equals:hover  { background: #3a56d4; }
    .key--equals:active { background: #2d45b8; }
    .key--clear    { color: #ff6b6b; }

    /* span full width for = on last row */
    .key--wide {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calc" role="application" aria-label="Calculator">
    <div class="display">
      <div class="display__expr" id="expr" aria-label="Expression"></div>
      <!-- AC1: display; aria-live for screen-readers -->
      <div class="display__main" id="main" aria-live="polite" aria-label="Result">0</div>
    </div>

    <!-- AC1: buttons for 0-9, ., +, -, ×, ÷, =, C -->
    <div class="keys">
      <button class="key key--clear" data-action="clear">C</button>
      <button class="key key--operator" data-action="operator" data-op="/">÷</button>
      <button class="key key--operator" data-action="operator" data-op="*">×</button>
      <button class="key key--operator" data-action="operator" data-op="-">−</button>

      <button class="key" data-action="digit" data-digit="7">7</button>
      <button class="key" data-action="digit" data-digit="8">8</button>
      <button class="key" data-action="digit" data-digit="9">9</button>
      <button class="key key--operator" data-action="operator" data-op="+">+</button>

      <button class="key" data-action="digit" data-digit="4">4</button>
      <button class="key" data-action="digit" data-digit="5">5</button>
      <button class="key" data-action="digit" data-digit="6">6</button>
      <!-- placeholder so + spans rows visually; repeat the + in last area -->
      <button class="key" data-action="digit" data-digit="1">1</button>

      <button class="key" data-action="digit" data-digit="2">2</button>
      <button class="key" data-action="digit" data-digit="3">3</button>
      <button class="key key--wide" data-action="digit" data-digit="0">0</button>

      <button class="key" data-action="digit" data-digit=".">.</button>
      <button class="key key--equals key--wide" data-action="equals">=</button>
    </div>
  </div>

  <script src="src/calculator.js"></script>
  <script>
    'use strict';

    let state = createCalc();

    const mainEl = document.getElementById('main');
    const exprEl = document.getElementById('expr');

    function render() {
      mainEl.textContent = state.display;
      mainEl.classList.toggle('error', state.error);
      if (state.operator && !state.fresh) {
        exprEl.textContent = '';
      } else if (state.operator) {
        const opSym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[state.operator] || state.operator;
        exprEl.textContent = (state.pending !== null ? state.pending : '') + ' ' + opSym;
      } else {
        exprEl.textContent = '';
      }
    }

    // Button clicks
    document.querySelector('.keys').addEventListener('click', function(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      handleAction(btn.dataset.action, btn.dataset);
    });

    function handleAction(action, data) {
      switch (action) {
        case 'digit':    state = pressDigit(state, data.digit);       break;
        case 'operator': state = pressOperator(state, data.op);       break;
        case 'equals':   state = pressEquals(state);                  break;
        case 'clear':    state = pressClear();                        break;
      }
      render();
    }

    // AC13 + AC14: keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key;
      if (/^[0-9]$/.test(key) || key === '.') {
        e.preventDefault();
        state = pressDigit(state, key);
      } else if (key === '+' || key === '-' || key === '*' || key === '/') {
        e.preventDefault();
        state = pressOperator(state, key);
      } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        state = pressEquals(state);
      } else if (key === 'Escape') {
        e.preventDefault();
        state = pressClear();
      }
      render();
    });

    render();
  </script>
</body>
</html>
